[package]
name = "pear-music-widget"
version = "1.9.0"
edition = "2021"
rust-version = "1.85"
description = "A floating now-playing widget and menu-bar player for macOS"
authors = ["litian"]

[dependencies]
anyhow = "1"
base64 = "0.23"
canto-hk-g2p-core = { path = "vendor/canto-hk-g2p-core" }
# Traditional → Simplified for the lyrics panel. Phrase-aware rather than a
# character table, which is the whole difference between 乾淨 → 干净 and
# 乾坤 staying 乾坤. MIT, and the rules are compiled in — no network, no C library.
fast2s = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1.13.1"
scraper = { version = "0.24", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = "0.29"
window-vibrancy = "0.8"
rodio = { version = "0.21.1", features = ["symphonia-aiff", "symphonia-alac"] }
lofty = "0.24.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }

# Only the handful of AppKit calls Tauri does not wrap: aspect ratio, window
# alpha, window level and collection behaviour. Raw `msg_send!` rather than the
# typed objc2-app-kit bindings keeps the dependency surface to two crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

# Tauri 2.11.x requires tray-icon 0.24, whose released build leaves an NSMenu
# attached to the status item. macOS 27 then swallows every left click and
# opens that menu instead of forwarding the click that shows our dropdown.
# This is 0.24.2 plus the merged upstream fix; remove it once Tauri can use
# tray-icon >= 0.25.1.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

# Decoding and image work are hot loops that are 20x slower unoptimised: a
# debug build otherwise spends ~270 ms per cover resize and risks audio
# underruns on 24/96 FLAC. Optimising just these keeps our own code debuggable.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.rodio]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
