<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Perch Strip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5Z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.9" y="4.6" width="4.2" height="14.8" rx="1.5"/><rect x="12.9" y="4.6" width="4.2" height="14.8" rx="1.5"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 5.5a1 1 0 0 1 2 0v4.9l8.4-5.3A1 1 0 0 1 19 6v12a1 1 0 0 1-1.6.8L9 13.6v4.9a1 1 0 0 1-2 0Z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M17 5.5a1 1 0 0 0-2 0v4.9L6.6 5.1A1 1 0 0 0 5 6v12a1 1 0 0 0 1.6.8L15 13.6v4.9a1 1 0 0 0 2 0Z"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11.4 4.2a1 1 0 0 1 1.6.8v14a1 1 0 0 1-1.6.8L6.8 16H4.5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 4.5 8h2.3ZM16 8.8a1 1 0 0 1 1.4.2 5 5 0 0 1 0 6 1 1 0 1 1-1.6-1.2 3 3 0 0 0 0-3.6 1 1 0 0 1 .2-1.4Z"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11.4 4.2a1 1 0 0 1 1.6.8v14a1 1 0 0 1-1.6.8L6.8 16H4.5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 4.5 8h2.3Zm4.3 5a1 1 0 0 1 1.4 0l1.3 1.3 1.3-1.3a1 1 0 1 1 1.4 1.4L19.8 12l1.3 1.3a1 1 0 0 1-1.4 1.4l-1.3-1.3-1.3 1.3a1 1 0 0 1-1.4-1.4l1.3-1.3-1.3-1.3a1 1 0 0 1 0-1.4Z"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17.3 3.8a1 1 0 0 1 1.4 0l2.5 2.5a1 1 0 0 1 0 1.4l-2.5 2.5a1 1 0 1 1-1.4-1.4l.8-.8h-1.5c-.9 0-1.4.3-2 1L14 10.2l-1.3-1.6.5-.6c1-1.2 2.1-1.8 3.6-1.8h1.4l-.9-.9a1 1 0 0 1 0-1.4ZM3 7.2a1 1 0 0 1 1-1h1.9c1.7 0 3 .8 4.1 2.1l4.3 5.3c.6.7 1.1 1 2 1h1.4l-.8-.8a1 1 0 1 1 1.4-1.4l2.5 2.5a1 1 0 0 1 0 1.4l-2.5 2.5a1 1 0 0 1-1.4-1.4l.8-.8h-1.5c-1.6 0-2.8-.7-3.9-2L8.5 9.5c-.7-.9-1.4-1.3-2.6-1.3H4a1 1 0 0 1-1-1Zm0 9.6a1 1 0 0 1 1-1h1.9c1.2 0 1.9-.4 2.6-1.3l.5-.6L10.4 15l-.4.5c-1.1 1.3-2.4 2.1-4.1 2.1H4a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.6 10.2V8.8a3.2 3.2 0 0 1 3.2-3.2h5.9" />
              <path d="M13.9 3.6 15.9 5.6 13.9 7.6" />
              <path d="M17.4 13.8v1.4a3.2 3.2 0 0 1-3.2 3.2H8.3" />
              <path d="M10.1 16.4 8.1 18.4 10.1 20.4" />
            </g>
          </symbol>
      <symbol id="i-repeat-one" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.6 10.2V8.8a3.2 3.2 0 0 1 3.2-3.2h5.9" />
              <path d="M13.9 3.6 15.9 5.6 13.9 7.6" />
              <path d="M17.4 13.8v1.4a3.2 3.2 0 0 1-3.2 3.2H8.3" />
              <path d="M10.1 16.4 8.1 18.4 10.1 20.4" />
              <path d="M10.9 10.7 12.4 9.7v4.6" />
            </g>
          </symbol>
      <symbol id="i-playlists" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 6.5h11M4 11.5h11M4 16.5h6.5" />
            </g>
            <path d="M14 14.2v5.2a1.9 1.9 0 1 1-1.1-1.7V14.4a1 1 0 0 1 .7-1l5.2-1.5a1 1 0 0 1 1.2 1v1.5l-6 1.8Z" />
          </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5a2 2 0 0 1 2-2h4.2l2 2.2h6.8a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></symbol>
      <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6.5a1 1 0 0 1 1-1h10a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 5a1 1 0 0 1 1-1h10a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 5a1 1 0 0 1 1-1h6a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm14.3-9.2a1 1 0 0 1 1.7.7v8a1 1 0 0 1-.6.9l-2.5 1.1a1.6 1.6 0 1 1-.8-1.8l1.9-.8V9.9l-2 .6a1 1 0 0 1-.6-1.9Z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3s-7.9-4.6-7.9-9.9A4.6 4.6 0 0 1 12 7.4a4.6 4.6 0 0 1 7.9 3c0 5.3-7.9 9.9-7.9 9.9Z"/></symbol>
    </defs>
  </svg>

  <main id="strip">
    <!-- One menu bar tall: the record, the song, its artist if the whole
         name fits, and a hairline of progress underneath. -->
    <div class="bar" id="bar">
      <div class="wing l">
        <span class="record"><i class="disc"></i><img class="cover" data-bind="cover" alt=""></span>
        <span class="song" data-bind="title"></span>
      </div>
      <div class="gap"><span class="dash">—</span></div>
      <div class="wing r">
        <span class="artist" id="artist" data-bind="artist"></span>
      </div>
      <i class="line"><b data-bind="progress"></b></i>
    </div>

    <!-- Drops in on hover, over the bar on a flat display, under it beside a
         notch. Always laid out, so opening never changes layout. -->
    <div class="sheet" id="sheet">
      <div class="view main">
        <div class="head">
          <span class="record lg">
            <i class="disc"></i>
            <img class="cover" data-bind="cover" alt="" title="Open YouTube Music">
          </span>
          <div class="meta">
            <p class="song" data-bind="title"></p>
            <!-- On YouTube Music the credit is one link to the artist view;
                 local files have no artist page, so theirs is plain text. -->
            <p class="byline" id="byline"></p>
          </div>
          <!-- The tracks either side in the queue; click one to play it. The
               button beside them opens the whole queue. -->
          <div class="around" id="around">
            <button class="neighbour" data-at="-1" hidden>
              <img class="thumb" alt="">
              <span class="words"><span class="name"></span><span class="where">Previous</span></span>
            </button>
            <button class="neighbour" data-at="1" hidden>
              <img class="thumb" alt="">
              <span class="words"><span class="name"></span><span class="where">Up next</span></span>
            </button>
            <button class="more" type="button" title="Queue"><svg><use href="#i-queue"/></svg></button>
          </div>
        </div>
        <div class="controls">
          <button class="btn side like" data-cmd="like" title="Like (right-click: dislike)"><svg><use href="#i-heart"/></svg></button>
          <div class="transport">
            <button class="btn mode" data-cmd="shuffle" id="shuffle" title="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
            <button class="btn" data-cmd="previous" title="Previous"><svg><use href="#i-prev"/></svg></button>
            <button class="btn pp" data-cmd="togglePlay" title="Play/Pause"><svg><use data-bind="ppIcon" href="#i-play"/></svg></button>
            <button class="btn" data-cmd="next" title="Next"><svg><use href="#i-next"/></svg></button>
            <button class="btn mode" data-cmd="repeat" id="repeat" title="Repeat"><svg><use id="repeat-glyph" href="#i-repeat"/></svg></button>
          </div>
          <button class="btn side" data-view="playlists" title="Playlists"><svg><use href="#i-playlists"/></svg></button>
        </div>
        <!-- The progress row; scrolling turns it into the volume for a moment. -->
        <div class="progress">
          <span data-bind="elapsed">0:00</span>
          <i class="track" data-seek><b data-bind="progress"></b></i>
          <span data-bind="remaining">0:00</span>
        </div>
        <div class="progress volume" aria-hidden="true">
          <svg class="speaker"><use id="speaker" href="#i-volume"/></svg>
          <i class="track"><b id="level-fill"></b></i>
          <span id="level">0</span>
        </div>
      </div>

      <!-- Playlists, or the artists on the track: a list in the sheet's
           place, with a way back. -->
      <div class="view list" hidden>
        <div class="list-head">
          <button class="back" type="button" title="Back">‹</button>
          <span class="list-title" id="list-title"></span>
        </div>
        <div class="list-scroll" id="list-scroll"></div>
      </div>
    </div>
  </main>

  <!-- The card's cover palette, shared as is. -->
  <script src="../palette.js"></script>
  <script src="app.js"></script>
</body>
</html>
