<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The CSP lives in src-tauri/tauri.conf.json, which Tauri serves as a
         header. A second policy here would only ever be the stricter of the
         two, and silently break the IPC channel. -->
    <title>Pear Music Widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5Z"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.9" y="4.6" width="4.2" height="14.8" rx="1.5"/><rect x="12.9" y="4.6" width="4.2" height="14.8" rx="1.5"/></symbol>
        <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 5.5a1 1 0 0 1 2 0v4.9l8.4-5.3A1 1 0 0 1 19 6v12a1 1 0 0 1-1.6.8L9 13.6v4.9a1 1 0 0 1-2 0Z"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M17 5.5a1 1 0 0 0-2 0v4.9L6.6 5.1A1 1 0 0 0 5 6v12a1 1 0 0 0 1.6.8L15 13.6v4.9a1 1 0 0 0 2 0Z"/></symbol>
        <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17.3 3.8a1 1 0 0 1 1.4 0l2.5 2.5a1 1 0 0 1 0 1.4l-2.5 2.5a1 1 0 1 1-1.4-1.4l.8-.8h-1.5c-.9 0-1.4.3-2 1L14 10.2l-1.3-1.6.5-.6c1-1.2 2.1-1.8 3.6-1.8h1.4l-.9-.9a1 1 0 0 1 0-1.4ZM3 7.2a1 1 0 0 1 1-1h1.9c1.7 0 3 .8 4.1 2.1l4.3 5.3c.6.7 1.1 1 2 1h1.4l-.8-.8a1 1 0 1 1 1.4-1.4l2.5 2.5a1 1 0 0 1 0 1.4l-2.5 2.5a1 1 0 0 1-1.4-1.4l.8-.8h-1.5c-1.6 0-2.8-.7-3.9-2L8.5 9.5c-.7-.9-1.4-1.3-2.6-1.3H4a1 1 0 0 1-1-1Zm0 9.6a1 1 0 0 1 1-1h1.9c1.2 0 1.9-.4 2.6-1.3l.5-.6L10.4 15l-.4.5c-1.1 1.3-2.4 2.1-4.1 2.1H4a1 1 0 0 1-1-1Z"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3s-7.9-4.6-7.9-9.9A4.6 4.6 0 0 1 12 7.4a4.6 4.6 0 0 1 7.9 3c0 5.3-7.9 9.9-7.9 9.9Z"/></symbol>
        <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11.4 4.2a1 1 0 0 1 1.6.8v14a1 1 0 0 1-1.6.8L6.8 16H4.5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 4.5 8h2.3ZM16 8.8a1 1 0 0 1 1.4.2 5 5 0 0 1 0 6 1 1 0 1 1-1.6-1.2 3 3 0 0 0 0-3.6 1 1 0 0 1 .2-1.4Z"/></symbol>
        <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11.4 4.2a1 1 0 0 1 1.6.8v14a1 1 0 0 1-1.6.8L6.8 16H4.5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 4.5 8h2.3Zm4.3 5a1 1 0 0 1 1.4 0l1.3 1.3 1.3-1.3a1 1 0 1 1 1.4 1.4L19.8 12l1.3 1.3a1 1 0 0 1-1.4 1.4l-1.3-1.3-1.3 1.3a1 1 0 0 1-1.4-1.4l1.3-1.3-1.3-1.3a1 1 0 0 1 0-1.4Z"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.92 12.11l4.24 4.24a1 1 0 0 1-1.42 1.42l-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></symbol>
        <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 5.5a1 1 0 0 1 1-1h9a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 4.5a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 4.5a1 1 0 0 1 1-1h9a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1ZM4 19a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Z"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5a1 1 0 0 0-.7 1.7l5.3 5.3-5.3 5.3a1 1 0 1 0 1.4 1.4l5.3-5.3 5.3 5.3a1 1 0 0 0 1.4-1.4L13.8 12l5.3-5.3a1 1 0 0 0-1.4-1.4L12.4 10.6 7.1 5.3A1 1 0 0 0 6.4 5Z"/></symbol>
        <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6.5a1 1 0 0 1 1-1h10a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 5a1 1 0 0 1 1-1h10a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 5a1 1 0 0 1 1-1h6a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm14.3-9.2a1 1 0 0 1 1.7.7v8a1 1 0 0 1-.6.9l-2.5 1.1a1.6 1.6 0 1 1-.8-1.8l1.9-.8V9.9l-2 .6a1 1 0 0 1-.6-1.9Z"/></symbol>
        <!-- The two repeat modes the corner button cycles between. Stroked
             rather than filled — a 13px loop drawn as a filled outline turns to
             mush — hence the <g> carrying the paint, since `.corner svg` sets a
             fill that the paths would otherwise inherit. The only difference
             between them is the 1 in the middle, which is the whole point: the
             glyph is what says which mode is on. -->
        <symbol id="i-repeat" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.6 10.2V8.8a3.2 3.2 0 0 1 3.2-3.2h5.9" />
            <path d="M13.9 3.6 15.9 5.6 13.9 7.6" />
            <path d="M17.4 13.8v1.4a3.2 3.2 0 0 1-3.2 3.2H8.3" />
            <path d="M10.1 16.4 8.1 18.4 10.1 20.4" />
          </g>
        </symbol>
        <symbol id="i-repeat-one" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.6 10.2V8.8a3.2 3.2 0 0 1 3.2-3.2h5.9" />
            <path d="M13.9 3.6 15.9 5.6 13.9 7.6" />
            <path d="M17.4 13.8v1.4a3.2 3.2 0 0 1-3.2 3.2H8.3" />
            <path d="M10.1 16.4 8.1 18.4 10.1 20.4" />
            <path d="M10.9 10.7 12.4 9.7v4.6" />
          </g>
        </symbol>
        <symbol id="i-note" viewBox="0 0 24 24"><path d="M20 3.6a1 1 0 0 0-1.2-1L9.5 4.7a1 1 0 0 0-.8 1v9.2A3.6 3.6 0 1 0 10.7 18V9.5l7.3-1.6v4.6a3.6 3.6 0 1 0 2 3.2Z"/></symbol>
      </defs>
    </svg>

    <div class="frame">
      <div class="card" id="card">
        <div class="ambient" id="ambient"></div>
        <div class="scrim"></div>

        <!-- A ring the page's drag handler ignores, so the window's own resize
             edges stay reachable rather than starting a window move. -->
        <div class="resize-edges" aria-hidden="true">
          <i class="edge n"></i><i class="edge s"></i><i class="edge w"></i><i class="edge e"></i>
        </div>

        <!-- DOM order is left-to-right, and each of the four can be turned off
             from the Corner buttons submenu, per skin. Repeat leads and is set
             slightly apart: the other three open a panel, it changes what the
             player does. -->
        <div class="corner-bar">
          <button class="corner repeat" id="btn-repeat" title="Repeat" aria-label="Repeat">
            <svg id="repeat-icon"><use href="#i-repeat" /></svg>
          </button>
          <button class="corner" id="btn-queue" title="Queue" aria-label="Queue">
            <svg><use href="#i-queue" /></svg>
          </button>
          <button class="corner" id="btn-lyrics" title="Lyrics" aria-label="Lyrics">
            <svg><use href="#i-lyrics" /></svg>
          </button>
          <button class="corner" id="btn-search" title="Search" aria-label="Search">
            <svg><use href="#i-search" /></svg>
          </button>
        </div>

        <main class="player" id="player">
          <div class="art" id="art" title="Double-click to open YouTube Music">
            <img id="cover" alt="" />
            <div class="art-empty"><svg class="glyph"><use href="#i-note" /></svg></div>
          </div>

          <div class="meta">
            <div class="titles">
              <div class="marquee"><span class="title" id="title">Nothing playing</span></div>
              <div class="marquee"><span class="subtitle" id="subtitle"></span></div>
            </div>

            <!-- The seek bar lives inside the control row so each skin can
                 place it with `order`: above the buttons, below them, or
                 inline between previous and next. -->
            <div class="controls">
              <div class="seek" id="seek" role="slider" aria-label="Seek" tabindex="-1">
                <div class="rail"><div class="fill" id="fill"></div></div>
                <div class="knob" id="knob"></div>
              </div>
              <button class="btn sm" id="btn-shuffle" data-cmd="shuffle" title="Shuffle">
                <svg><use href="#i-shuffle" /></svg>
              </button>
              <button class="btn" id="btn-prev" data-cmd="previous" title="Previous">
                <svg><use href="#i-prev" /></svg>
              </button>
              <button class="btn play" id="btn-play" data-cmd="togglePlay" title="Play/Pause">
                <svg id="play-icon"><use href="#i-play" /></svg>
              </button>
              <button class="btn" id="btn-next" data-cmd="next" title="Next">
                <svg><use href="#i-next" /></svg>
              </button>
              <button class="btn sm" id="btn-like" data-cmd="like" title="Like">
                <svg><use href="#i-heart" /></svg>
              </button>
              <div class="volume" id="volume">
                <button class="btn sm" id="btn-mute" data-cmd="toggleMute" title="Volume">
                  <svg id="volume-icon"><use href="#i-volume" /></svg>
                </button>
                <div class="vol-pop">
                  <div class="vol-panel">
                    <div class="vol-hit" id="vol-hit">
                      <div class="vol-rail" id="vol-rail"><div class="vol-fill" id="vol-fill"></div></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>

        <section class="upnext" id="upnext" hidden>
          <div class="upnext-grid" id="upnext-grid"></div>
        </section>

        <!-- No head at all. It had already lost its heading — the lit corner
             button says which panel this is, and the rows are plainly a queue —
             which left 26px of empty strip holding a slot count in the corner,
             directly under Stack's own queue strip. The rows start at the top
             and the panel is that much taller in list. -->
        <section class="queue" id="queue" hidden>
          <div class="queue-list" id="queue-list"></div>
          <p class="queue-note" id="queue-note" hidden></p>
        </section>

        <section class="lyrics" id="lyrics" hidden>
          <div class="lyrics-scroll" id="lyrics-scroll">
            <div class="lyrics-lines" id="lyrics-lines"></div>
          </div>
          <p class="lyrics-note" id="lyrics-note"></p>
        </section>

        <section class="search" id="search" hidden>
          <div class="search-bar">
            <svg class="search-glyph" aria-hidden="true"><use href="#i-search" /></svg>
            <input
              id="search-input"
              type="text"
              placeholder="Search YouTube Music"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="btn sm" id="search-close" title="Close" aria-label="Close search">
              <svg><use href="#i-close" /></svg>
            </button>
          </div>
          <div class="results" id="results"></div>
          <p class="search-note" id="search-note">Type to search.</p>
        </section>

        <section class="setup" id="setup" hidden>
          <div class="setup-icon"><span class="pulse"></span></div>
          <h1 id="setup-title">Connecting…</h1>
          <p id="setup-body">Looking for the YouTube Music API server.</p>
          <div class="setup-actions">
            <button class="pill" id="setup-open">Open YouTube Music</button>
            <button class="pill ghost" id="setup-retry">Retry</button>
          </div>
        </section>
      </div>
    </div>

    <!-- bridge.js defines window.widget, which app.js is written against. -->
    <script src="bridge.js"></script>
    <script src="palette.js"></script>
    <script src="app.js"></script>
  </body>
</html>
